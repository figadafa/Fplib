name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Jalankan test
        if: hashFiles('test_fplib.py') != ''
        run: pytest -v

      - name: Cek semua aplikasi bisa dijalankan
        run: |
          for f in app_*.py; do
            [ -f "$f" ] || continue
            echo "Menjalankan $f"
            python "$f"
          done